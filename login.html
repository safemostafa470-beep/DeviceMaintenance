<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الفنيين - الهوارى</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary-color: #38bdf8;
            --primary-hover: #0ea5e9;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --error-color: #ef4444;
            --success-color: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h2 { color: var(--primary-color); margin-bottom: 5px; font-size: 2rem; font-weight: 800; }
        .login-card .sub-title { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px; }
        
        .btn-client-access {
            display: block;
            width: 100%;
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary-color);
            border: 1px dashed var(--primary-color);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .btn-client-access:hover { background: rgba(56, 189, 248, 0.2); }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.7);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: var(--primary-color); }
        
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .remember-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary-color); }

        .btn-login {
            background: var(--primary-color);
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-login:hover { background: var(--primary-hover); }
        .btn-login:disabled { background: #64748b; cursor: not-allowed; }
        
        .error-msg { color: var(--error-color); font-size: 0.85rem; margin-top: 10px; display: none; line-height: 1.4; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 6px; text-align: right; }
        
        .contact-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .phone-text { font-size: 0.9rem; color: #f1f5f9; direction: ltr; font-weight: bold; }
        .btn-copy {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .footer-credit {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px dashed var(--border-color);
            padding-top: 12px;
        }
        .footer-credit span { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>الهوارى</h2>
        <div class="sub-title">نظام إدارة صيانة الأجهزة الذكية</div>
        
        <a href="index.html" class="btn-client-access">👤 دخول العملاء (استعلام عن الأجهزة)</a>

        <form id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم (الفني):</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <label class="remember-row">
                <input type="checkbox" id="rememberMe"> تذكرني
            </label>

            <button type="submit" id="submitBtn" class="btn-login">تسجيل الدخول</button>
        </form>

        <p class="error-msg" id="errorMsg"></p>

        <div class="contact-section">
            <span style="font-size: 0.8rem; color: var(--text-muted);">للدعم والتواصل:</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="phone-text" id="phoneNum">0575840397</span>
                <button type="button" class="btn-copy" onclick="copyPhone(event)">نسخ</button>
            </div>
        </div>

        <div class="footer-credit">
            تم التطوير بواسطة <span>الهوارى</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vvxkxmktkxawptbrqtut.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2eGt4bWt0a3hhd3B0YnJxdHV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NDY2MTcsImV4cCI6MjEwNjAyMjYxN30.NkqXPEpMf6VFE3nFQ1V7T5HyjfoxIrT_apKh7S6a_14';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = function() {
            const savedUser = localStorage.getItem('saved_username');
            if(savedUser) {
                document.getElementById('username').value = savedUser;
                document.getElementById('rememberMe').checked = true;
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const errorEl = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            errorEl.style.display = 'none';

            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const remember = document.getElementById('rememberMe').checked;

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري التحقق من السيرفر...';

            try {
                const { data, error } = await _supabase
                    .from('technicians')
                    .select('*')
                    .eq('username', user)
                    .maybeSingle();

                if (error) throw new Error(error.message);

                if (!data) {
                    errorEl.style.display = 'block';
                    errorEl.innerText = 'اسم المستخدم غير موجود في قاعدة البيانات!';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'تسجيل الدخول';
                    return;
                }

                const dbPass = data.password || data.pass;
                if (dbPass !== pass) {
                    errorEl.style.display = 'block';
                    errorEl.innerText = 'كلمة المرور غير صحيحة!';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'تسجيل الدخول';
                    return;
                }

                if (data.status === 'موقوف' || data.status === 'وقف' || data.is_active === false || data.active === false) {
                    errorEl.style.display = 'block';
                    errorEl.innerText = 'عذراً، هذا الحساب موقوف من قبل الإدارة.';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'تسجيل الدخول';
                    return;
                }

                if (data.expiry_date) {
                    const today = new Date().toISOString().split('T')[0];
                    if (today > data.expiry_date) {
                        errorEl.style.display = 'block';
                        errorEl.innerText = 'عذراً، انتهت صلاحية اشتراكك الشهري. يرجى التجديد.';
                        submitBtn.disabled = false;
                        submitBtn.innerText = 'تسجيل الدخول';
                        return;
                    }
                }

                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', user);
                localStorage.setItem('username', user);
                localStorage.setItem('currentTech', user);
                localStorage.setItem('shopData', JSON.stringify(data));

                if(remember) {
                    localStorage.setItem('saved_username', user);
                } else {
                    localStorage.removeItem('saved_username');
                }
                
                window.location.href = 'dashboard.html?user=' + encodeURIComponent(user);

            } catch (err) {
                console.error(err);
                errorEl.style.display = 'block';
                errorEl.innerText = 'حدث خطأ في الاتصال: ' + err.message;
                submitBtn.disabled = false;
                submitBtn.innerText = 'تسجيل الدخول';
            }
        });

        function copyPhone(event) {
            const phoneText = document.getElementById('phoneNum').innerText;
            navigator.clipboard.writeText(phoneText).then(() => {
                const btn = event.target;
                btn.innerText = 'تم النسخ ✓';
                btn.style.background = '#22c55e';
                btn.style.color = 'white';
                setTimeout(() => {
                    btn.innerText = 'نسخ';
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            });
        }
    </script>
</body>
</html>
